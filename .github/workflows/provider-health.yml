name: Provider health

# The unit suite runs entirely on fixtures, so it stays green even if every
# provider goes down. This is the check that actually notices a provider
# changing its catalogue URLs or response shape. It is deliberately kept out
# of Lint/Test/Deploy: it depends on third-party sites, so a failure here
# means "a channel is broken", not "this change is bad", and it must never
# block a deploy.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check every provider against its live catalogue
        run: RUN_INTEGRATION_TESTS=1 npm run test:integration
      # Listing and playing are separate failures. The step above proves a
      # channel returns items; this one proves Hot Tub can extract a stream
      # from the watch pages those items point at. Channels once shipped
      # verified only for listing, and the ones with no extractor reached the
      # operator as "video unavailable".
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yt-dlp
      - name: Check watch pages are extractable
        run: node scripts/check-playability.mjs
