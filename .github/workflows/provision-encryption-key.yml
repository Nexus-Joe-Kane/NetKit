name: Provision encryption key

# Generates TOKEN_ENCRYPTION_KEYS on the runner and writes it straight to the
# Worker, so the operator never needs a terminal and the key never passes
# through a chat window, a GitHub secret, or this workflow's logs.
#
# Run it from Actions -> Provision encryption key -> Run workflow, which works
# from a phone browser.

on:
  workflow_dispatch:
    inputs:
      replace:
        description: >-
          Replace an existing key. Destroys access to every stored provider
          connection, which must then be reconnected at /account.
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_ALLOWED_IPS: ${{ vars.ADMIN_ALLOWED_IPS }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare Cloudflare resources
        run: node scripts/prepare-deploy-config.mjs .generated.wrangler.jsonc

      # Names only. Cloudflare never returns a secret's value, which is exactly
      # why an existing key cannot be kept in the ring alongside a new one here.
      - name: Check for an existing key
        id: existing
        run: |
          set -euo pipefail
          if npx wrangler secret list --format json --config .generated.wrangler.jsonc \
            | grep -q TOKEN_ENCRYPTION_KEYS; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to clobber an existing key
        if: ${{ steps.existing.outputs.present == 'true' && inputs.replace != true }}
        run: |
          echo "TOKEN_ENCRYPTION_KEYS is already set." >&2
          echo "Re-run with 'replace' ticked only if you accept that every stored" >&2
          echo "provider connection becomes undecryptable and must be reconnected." >&2
          exit 1

      # The value is piped directly into wrangler and never echoed, written to a
      # file, or exported, so it cannot leak through the workflow log.
      - name: Generate and store the key
        run: |
          set -euo pipefail
          key_id="$(date -u +%Y-%m)"
          openssl rand -base64 32 \
            | tr '+/' '-_' \
            | tr -d '=\n' \
            | sed "s|^|${key_id}:|" \
            | npx wrangler secret put TOKEN_ENCRYPTION_KEYS --config .generated.wrangler.jsonc
          echo "Stored a new AES-256 key under ID ${key_id}."

      - name: Confirm the Worker can see it
        run: |
          set -euo pipefail
          npx wrangler secret list --format json --config .generated.wrangler.jsonc \
            | grep -q TOKEN_ENCRYPTION_KEYS
          echo "TOKEN_ENCRYPTION_KEYS is present on the Worker."
          echo "Open /account from the VPN; it should now offer to connect a provider."
