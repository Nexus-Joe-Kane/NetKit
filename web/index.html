<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the safe-area insets below are non-zero on a
         notched iPhone; the CSS then keeps content clear of the notch and the
         home bar rather than letting Safari letterbox the whole page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="SupportWizard NetKit — UK signal, broadband availability, UPRN and line intelligence from one search box." />
    <meta name="theme-color" content="#0d1b3e" />
    <title>NetKit · Support Wizard</title>
    <link rel="icon" type="image/png" href="/brand/supportwizard-mark.png" />
    <link rel="apple-touch-icon" href="/brand/supportwizard-mark.png" />
    <!-- Poppins is self-hosted, so the first paint is already in the house
         face rather than swapping out of a fallback. -->
    <link rel="preload" href="/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
